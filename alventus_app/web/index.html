<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Alventus">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Alventus</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- Dictado por voz 100% local (WebAssembly) para iPhone/Safari,
       ver dictation.js y lib/widgets/speech/local_dictation.dart -->
  <script src="dictation.js"></script>
  <script src="file_saver.js"></script>
  <!-- Generador del PDF del viaje (botón "Generar PDF" en Etapas y
       tareas). Es pequeño; la librería pesada que usa, pdf-lib, no se
       carga aquí sino la primera vez que se genera un PDF. Ver
       web/trip_pdf.js. -->
  <!-- El "?v=" hay que subirlo cada vez que cambie trip_pdf.js, para
       que el navegador no use una copia vieja guardada. -->
  <script src="trip_pdf.js?v=15"></script>
  <!-- Avisos en el teléfono (notificaciones push). Ver web/push.js. -->
  <script src="push.js?v=1"></script>

  <!-- Registra el service worker propio que permite usar la app sin
       conexión (modo avión). Ver web/offline_sw.js para el porqué y
       cómo funciona. No sustituye ni depende del service worker que
       genera el propio "flutter build web" (flutter_service_worker.js),
       que Flutter deja vacío a propósito. -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('offline_sw.js').catch(function (e) {
          console.warn('No se pudo registrar el service worker offline:', e);
        });
      });
    }
  </script>

  <!-- Hace que el motor gráfico de Flutter (CanvasKit) se cargue de la
       COPIA LOCAL que ya viene en esta misma carpeta, en vez de
       descargarla de www.gstatic.com cada vez que arranca la app.

       Por qué importa: al descargarse de otro dominio, esa copia no la
       puede guardar nuestro service worker (solo guarda lo de este
       mismo sitio), así que sin cobertura no había forma de obtenerla y
       la app no llegaba a dibujar nada: pantalla en blanco. Y no se
       notaba teniendo la app ya abierta, porque entonces el motor ya
       estaba cargado en memoria; solo aparecía cuando el iPhone
       descargaba la app de la memoria al dejarla en segundo plano y al
       volver tenía que arrancarla otra vez, ya sin cobertura.

       Cómo funciona: el propio flutter_bootstrap.js decide entre la
       copia local y la de gstatic mirando "useLocalCanvasKit" dentro de
       _flutter.buildConfig, que él mismo rellena al cargarse. Aquí se
       prepara esa propiedad de antemano para marcarla en cuanto la
       escriba. Si algún día Flutter cambiara por dentro y esto dejara
       de encajar, la app seguiría funcionando igual que hasta ahora
       (volvería a tirar de gstatic), no se rompe nada.

       Lo mismo se consigue compilando con "flutter build web
       --no-web-resources-cdn"; esto lo deja asegurado aunque no se use
       esa opción. -->
  <script>
    window._flutter = window._flutter || {};
    (function () {
      try {
        var almacenado;
        Object.defineProperty(window._flutter, 'buildConfig', {
          configurable: true,
          enumerable: true,
          get: function () { return almacenado; },
          set: function (valor) {
            if (valor && typeof valor === 'object') {
              valor.useLocalCanvasKit = true;
            }
            almacenado = valor;
          }
        });
      } catch (e) {
        console.warn('No se pudo forzar el CanvasKit local:', e);
      }
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
